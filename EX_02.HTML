<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 02</title>
</head>
<body>
    <script>
        var n1=parseFloat(prompt("Digite um número : "))
        var n2=parseFloat(prompt("Digite outro número : "))
        var n3=parseFloat(prompt("Digite outro número : "))

    if(n1==n2&&n2==n3)
    {
        alert("Os três números digitados sâo iguais!")
    }
    else if(n1>=n2&&n1>=n3)
    {
        alert(`O número ${n1} é o maior.`)
    }
    else if(n2>=n1&&n2>=n3)
    {
        alert(`O número ${n2} é o maior.`)
    }
    else if(n3>=n1&&n3>=n2)
    {
        alert(`O número ${n3} é o maior.`)
    }





    </script>
</body>
</html>
