<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 04</title>
</head>
<body>
    <script>
        
        var n1=parseInt(prompt("Digite um número inteiro positivo: "))
        var resultado=0
        for(var i=1;i<=n1;i++)
        {
            resultado+=i
        }
        alert(`O resultado da soma de todos os números entre 1 e ${n1} é: ${resultado}`)


    </script>
</body>
</html>
